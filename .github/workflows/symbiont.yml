name: symbiont

# Weekly: Symbiont runs on this repo and opens a PR with any verified fixes.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          setup-command: pip install --quiet -e ".[dev]"
          # To let an LLM fix what ruff can't, add a secret and uncomment:
          # llm-provider: anthropic
          # llm-model: claude-sonnet-5-5
          # api-key: ${{ secrets.ANTHROPIC_API_KEY }}
