[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-symbiont"
version = "4.0.0"
description = "Small, verified improvements to your repo: found, fixed in an isolated worktree, tested, then handed to you as a patch."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "PyYAML>=6",
  "ruff>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sym = "symbiont.cli:app"

[tool.setuptools.packages.find]
include = ["symbiont*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501", "B008"]  # B008: typer declares CLI args via call defaults
